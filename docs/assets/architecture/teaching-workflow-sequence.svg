<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Teaching workflow sequence</title>
  <desc id="desc">A sequence diagram from problem import to hint, follow-up, completion review, skill merge, and recommendation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#264653"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .lane { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 16; }
      .node { fill: #eef6ff; stroke: #4d83c2; stroke-width: 1.5; rx: 10; }
      .model { fill: #fff3d8; stroke: #d08a00; stroke-width: 1.5; rx: 10; }
      .skill { fill: #edf8f0; stroke: #4f9a67; stroke-width: 1.5; rx: 10; }
      .data { fill: #f4f1ff; stroke: #7a63c7; stroke-width: 1.5; rx: 10; }
      .end { fill: #f8f9fa; stroke: #6b7280; stroke-width: 1.5; rx: 10; }
      .title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #17212f; }
      .label { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #243447; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #596677; }
      .arrow { stroke: #264653; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #8a97a8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="50" y="48">TeachingWorkflow: Explicit Coach Loop With Persistent AttemptSession</text>
  <text class="small" x="50" y="72">Every AI action reads a session, writes trace/evidence, and returns a UI-safe result.</text>

  <rect class="lane" x="40" y="100" width="1200" height="610"/>
  <rect class="node" x="80" y="150" width="170" height="68"/>
  <text class="label" x="112" y="178">Problem Intake</text>
  <text class="small" x="105" y="199">Luogu / Markdown</text>

  <rect class="data" x="310" y="150" width="170" height="68"/>
  <text class="label" x="338" y="178">AttemptSession</text>
  <text class="small" x="337" y="199">thread + code snapshot</text>

  <rect class="data" x="540" y="150" width="170" height="68"/>
  <text class="label" x="570" y="178">Teacher Pack</text>
  <text class="small" x="565" y="199">hidden reference model</text>

  <rect class="node" x="770" y="150" width="170" height="68"/>
  <text class="label" x="798" y="178">Context Gate</text>
  <text class="small" x="804" y="199">role-safe bundle</text>

  <rect class="model" x="1000" y="150" width="170" height="68"/>
  <text class="label" x="1034" y="178">ModelRouter</text>
  <text class="small" x="1026" y="199">diagnosis / coach</text>

  <rect class="node" x="190" y="330" width="170" height="68"/>
  <text class="label" x="222" y="358">Hint Result</text>
  <text class="small" x="214" y="379">one pain point + step</text>

  <rect class="node" x="420" y="330" width="170" height="68"/>
  <text class="label" x="456" y="358">Follow-Up</text>
  <text class="small" x="453" y="379">same thread context</text>

  <rect class="node" x="650" y="330" width="170" height="68"/>
  <text class="label" x="690" y="358">Lesson / Score</text>
  <text class="small" x="680" y="379">abandon or complete</text>

  <rect class="skill" x="880" y="330" width="170" height="68"/>
  <text class="label" x="914" y="358">Skill Merge</text>
  <text class="small" x="905" y="379">patch + evidence rules</text>

  <rect class="skill" x="535" y="525" width="210" height="75"/>
  <text class="label" x="570" y="555">Recommendation v2</text>
  <text class="small" x="570" y="577">pain + difficulty + transfer</text>

  <rect class="end" x="815" y="525" width="220" height="75"/>
  <text class="label" x="858" y="555">Learning Profile UI</text>
  <text class="small" x="858" y="577">evidence, correction, rollback</text>

  <path class="arrow" d="M250 184 H310"/>
  <path class="arrow" d="M480 184 H540"/>
  <path class="arrow" d="M710 184 H770"/>
  <path class="arrow" d="M940 184 H1000"/>
  <path class="arrow" d="M1085 218 C1085 280, 275 275, 275 330"/>
  <path class="arrow" d="M360 364 H420"/>
  <path class="arrow" d="M590 364 H650"/>
  <path class="arrow" d="M820 364 H880"/>
  <path class="arrow" d="M965 398 C965 470, 640 470, 640 525"/>
  <path class="arrow" d="M745 562 H815"/>
  <path class="soft" d="M395 218 C395 265, 505 285, 505 330"/>
  <path class="soft" d="M395 218 C395 485, 640 485, 640 525"/>
  <path class="soft" d="M965 398 C1005 450, 1005 500, 925 525"/>

  <text class="small" x="74" y="672">Invariant: abandon creates a lesson report; completion review records learning score before archive; follow-up stays in the same AttemptSession.</text>
</svg>
