name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Type-check OJ console
        run: npx tsc -p tsconfig.oj-console.json --noEmit

      - name: Type-check release build
        run: npx tsc -p tsconfig.release.json --noEmit

      - name: Build release package
        run: npm run package:beta-release

      - name: Check release hygiene
        run: npm run check:hygiene

      - name: Audit production dependencies
        run: npm audit --omit=dev
